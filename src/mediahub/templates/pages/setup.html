{% extends "layouts/auth.html" %}
{% set page_title = "Welcome" %}
{% block subtitle %}Create the admin account for this server{% endblock %}
{% block content %}
<form method="post" action="/setup" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {{ ui.alert_list(errors) }}
  <label class="block space-y-1.5">
    <span class="text-sm font-medium">Username</span>
    <input class="input w-full" name="username" value="{{ username|default('') }}" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="64" required autofocus>
  </label>
  <label class="block space-y-1.5">
    <span class="text-sm font-medium">Password</span>
    <input class="input w-full" type="password" name="password" autocomplete="new-password" minlength="{{ min_length }}" required>
    <span class="block text-xs muted">At least {{ min_length }} characters.</span>
  </label>
  <label class="block space-y-1.5">
    <span class="text-sm font-medium">Confirm password</span>
    <input class="input w-full" type="password" name="password_confirm" autocomplete="new-password" minlength="{{ min_length }}" required>
  </label>
  <button class="btn btn-primary w-full" type="submit">Create account</button>
</form>
{% endblock %}
