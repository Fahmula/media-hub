<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex, nofollow">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "historyCacheSize": 0, "defaultSettleDelay": 0}'>
  <title>{% block title %}{{ page_title|default("Dashboard") }}{% endblock %} · MediaHub</title>
  <link rel="icon" href="{{ static_url('img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_url('dist/app.css') }}">
  <script src="{{ static_url('vendor/htmx-2.0.10.min.js') }}" defer></script>
  <script src="{{ static_url('js/app.js') }}" defer></script>
</head>
<body class="min-h-dvh" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
{% block body %}{% endblock %}
</body>
</html>
