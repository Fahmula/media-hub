# Developer CLI config. The app runs migrations itself at startup.
# Usage: MEDIAHUB_CONFIG_DIR=./.dev-config uv run alembic revision --autogenerate -m "..."
[alembic]
script_location = src/mediahub/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
